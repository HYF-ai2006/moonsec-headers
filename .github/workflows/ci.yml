name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Format check
        run: moon fmt --check

      - name: Check without warnings
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test without warnings
        run: moon test --deny-warn

      - name: Verify patch whitespace
        run: git diff --check HEAD^

      - name: Run CLI smoke example
        run: moon run cmd/main
